:root{--bg:#0b0d12;--fg:#e8e2d6}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Montserrat,system-ui,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 16px;box-sizing:border-box}
canvas{height:calc(100% - 64px);max-width:100%;aspect-ratio:9/16;border-radius:10px;box-shadow:0 6px 30px #0008;background:#000}
#ctl{display:none;gap:10px;align-items:center;width:min(100%,720px)}
#ctl button{font:inherit;font-size:16px;min-width:46px;height:40px;padding:0 10px;border-radius:10px;border:0;background:#F5B041;color:#0b0d12;cursor:pointer}
#ctl #subs{background:#2a2d3a;color:#e8e2d6}
#ctl input{flex:1;accent-color:#F5B041}
#time{font-size:13px;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
body.render #wrap{padding:0} body.render canvas{width:1080px;height:auto;border-radius:0;box-shadow:none}

<script>/* Portfolio ad — twilight rim-lit stickman style, 1920×1080, 30 s. HTML5 Canvas, deterministic.
 * renderAt(t) draws storyboard time t (seconds). window.ASSETS {name: dataURI}. Optional window.SYNC {dur, keys:[[real, story]...]}
 * and window.AUDIO (data URI) let the player run on the voiced timeline with sound.
 */
'use strict';
const W = 1920, H = 1080, DURATION = 30, GROUND = 905;
const VERT = !!window.VERTICAL, FULL = window.VERTICAL === 'full';   // FULL: the whole 16:9 scene in the middle of a 9:16 frame          // 9:16 TikTok/Reels cut: scene in a tall band, camera follows the action, text re-laid out
const OVER = { badges: [] };
const BIO = window.CTA === 'bio';        // end on 'Hire me on Freelancer — link in bio'
const C = {
  ink: '#0B0D12', rim: '#F5B041', rim2: '#E59866', coral: '#D9534F', orange: '#D98850', violet: '#4A3B5C', navy: '#181C2E',
  gold: '#F4D03F', white: '#FFFFFF', window: '#F7C46C', teal: '#1E4D5C', olive: '#8A855C', yellow: '#FFD43B',
};

// ------------------------------------------------------------------ math / easing
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
